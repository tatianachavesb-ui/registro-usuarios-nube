services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.12
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DB_HOST: db
      DB_USER: estudiante
      DB_PASSWORD: estudiante123
      DB_NAME: ingenieria_web
    depends_on:
      - db

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root123
      MARIADB_DATABASE: ingenieria_web
      MARIADB_USER: estudiante
      MARIADB_PASSWORD: estudiante123
    volumes:
      - mariadb-data:/var/lib/mysql
      - ../schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  adminer:
    image: adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db
    network_mode: service:app

volumes:
  mariadb-data:
